<html lang="en">

  <style>
    :root {
      color-scheme: light dark;
      --paper: #f4efe4;
      --ink: #1f1c18;
      --ink-soft: #6a6357;
      --rule: #ddd5c4;
      --rule-strong: #c4bAa4;
      --accent: #b5342b;
      --positive: #356b4a;
      --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino,
        Georgia, AppleMyungjo, "Nanum Myeongjo", Batang, "Hiragino Mincho ProN",
        "Yu Mincho", serif;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;

      --s1: 0.5rem;
      --s2: 1rem;
      --s3: 1.5rem;
      --s4: 2.5rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151310;
        --ink: #ece5d8;
        --ink-soft: #98907f;
        --rule: #302b23;
        --rule-strong: #473f33;
        --accent: #e0645a;
        --positive: #8fc9a1;
      }
    }

    [data-theme="light"] {
      color-scheme: light;
      --paper: #f4efe4;
      --ink: #1f1c18;
      --ink-soft: #6a6357;
      --rule: #ddd5c4;
      --rule-strong: #c4bAa4;
      --accent: #b5342b;
      --positive: #356b4a;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --paper: #151310;
      --ink: #ece5d8;
      --ink-soft: #98907f;
      --rule: #302b23;
      --rule-strong: #473f33;
      --accent: #e0645a;
      --positive: #8fc9a1;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-width: 18rem;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 0.25rem;
      padding: 0.55rem 0.9rem;
      color: var(--ink-soft);
      background: none;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 120ms ease;
    }

    button:hover:not(:disabled) { color: var(--ink); }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    /* Keep the current card action prominent while making an unanswered card's
       optional navigation visibly secondary. */
    .player__next-button:not(:disabled) {
      color: var(--paper);
      background: var(--ink);
      padding-inline: 1.1rem;
    }

    .player__next-button:not(:disabled):hover {
      color: var(--paper);
      background: var(--accent);
    }

    .player__next-button--skip:not(:disabled) {
      color: var(--ink-soft);
      background: none;
      padding-inline: 0;
      font-size: 0.84rem;
      font-weight: 500;
    }

    .player__next-button--skip:not(:disabled):hover {
      color: var(--accent);
      background: none;
    }

    /* Keep one response action visually stronger than optional card help. */
    .player__primary-action {
      align-self: flex-end;
      color: var(--paper);
      background: var(--ink);
      padding-inline: 1.1rem;
    }

    .player__primary-action:hover:not(:disabled) {
      color: var(--paper);
      background: var(--accent);
    }

    a { color: var(--accent); }

    .player {
      width: min(100% - 3rem, 46rem);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      --shell-gutter: clamp(2.5rem, 12vh, 7rem);
      padding: var(--shell-gutter) 0 max(var(--shell-gutter), env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .player__header {
      min-height: 2.5rem;
      margin-bottom: var(--s3);
    }

    .player__title {
      min-width: 0;
      max-width: calc(24ch + 3.5rem);
      margin: 0;
      padding-right: 3.5rem;
      font-family: var(--serif);
      font-variant-numeric: oldstyle-nums;
      font-size: clamp(1.7rem, 4.5vw, 2.35rem);
      font-weight: 500;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .player__theme-toggle {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      z-index: 2;
      display: inline-flex;
      width: 3rem;
      height: 3rem;
      min-height: 3rem;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      padding: 0;
      color: var(--ink);
      background: transparent;
      line-height: 1;
    }

    .player__theme-toggle:hover:not(:disabled),
    .player__theme-toggle:focus-visible {
      color: var(--accent);
      background: var(--rule);
    }

    .player__theme-icon {
      display: block;
      width: 1.5rem;
      height: 1.5rem;
    }

    .player__theme-icon [data-theme-icon][hidden] {
      display: none;
    }

    .player__theme-icon [data-theme-icon="moon"] path {
      fill: currentColor;
    }

    .player__theme-icon [data-theme-icon="sun"] circle,
    .player__theme-icon [data-theme-icon="sun"] path {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .player__progress-panel { margin: 0; }

    /* The bar is the page rule: a hairline that fills as the deck advances,
       instead of a bar plus a label plus a percentage all saying the same thing. */
    .player__progress-bar {
      display: block;
      width: 100%;
      height: 9px;
      border: 0;
      background: var(--rule);
      -webkit-mask-image: url("data:image/svg+xml,%3Csvg xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27 viewBox%3D%270 0 1000 16%27 preserveAspectRatio%3D%27none%27%3E%3Cfilter id%3D%27b%27 x%3D%27-6%25%27 y%3D%27-60%25%27 width%3D%27112%25%27 height%3D%27220%25%27%3E%3CfeTurbulence type%3D%27fractalNoise%27 baseFrequency%3D%270.6 1.1%27 numOctaves%3D%273%27 seed%3D%274%27 result%3D%27t%27%2F%3E%3CfeDisplacementMap in%3D%27SourceGraphic%27 in2%3D%27t%27 scale%3D%273%27 xChannelSelector%3D%27R%27 yChannelSelector%3D%27G%27%2F%3E%3CfeGaussianBlur stdDeviation%3D%270.45%27%2F%3E%3C%2Ffilter%3E%3Cpath filter%3D%27url%28%23b%29%27 d%3D%27M1 8.4C36 5 84 2.9 148 2.2c112-1.2 232 1.4 352 .5 120-.9 236 1.9 344 1.160-.5 108 .4 154 2.6l0 3.4c-46 2.6-94 3.7-154 3.2-108-.9-224 1.9-344 1-120-.9-240 1.7-352 .5C84 13.4 36 11.4 1 8.4Z%27%2F%3E%3C%2Fsvg%3E");
      mask-image: url("data:image/svg+xml,%3Csvg xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27 viewBox%3D%270 0 1000 16%27 preserveAspectRatio%3D%27none%27%3E%3Cfilter id%3D%27b%27 x%3D%27-6%25%27 y%3D%27-60%25%27 width%3D%27112%25%27 height%3D%27220%25%27%3E%3CfeTurbulence type%3D%27fractalNoise%27 baseFrequency%3D%270.6 1.1%27 numOctaves%3D%273%27 seed%3D%274%27 result%3D%27t%27%2F%3E%3CfeDisplacementMap in%3D%27SourceGraphic%27 in2%3D%27t%27 scale%3D%273%27 xChannelSelector%3D%27R%27 yChannelSelector%3D%27G%27%2F%3E%3CfeGaussianBlur stdDeviation%3D%270.45%27%2F%3E%3C%2Ffilter%3E%3Cpath filter%3D%27url%28%23b%29%27 d%3D%27M1 8.4C36 5 84 2.9 148 2.2c112-1.2 232 1.4 352 .5 120-.9 236 1.9 344 1.160-.5 108 .4 154 2.6l0 3.4c-46 2.6-94 3.7-154 3.2-108-.9-224 1.9-344 1-120-.9-240 1.7-352 .5C84 13.4 36 11.4 1 8.4Z%27%2F%3E%3C%2Fsvg%3E");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    .player__progress-bar::-webkit-progress-bar { background: var(--rule); }

    .player__progress-bar::-webkit-progress-value {
      background: var(--accent);
      box-shadow: 1px 0 2px -0.5px var(--accent);
      transition: width 260ms cubic-bezier(0.2, 0.7, 0.3, 1);
    }

    .player__progress-bar::-moz-progress-bar { background: var(--accent); }

    .player__main {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    .player__card {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: var(--s4) 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--rule-strong) transparent;
    }

    .player__card::-webkit-scrollbar {
      width: 0.45rem;
    }

    .player__card::-webkit-scrollbar-track {
      background: transparent;
    }

    .player__card::-webkit-scrollbar-thumb {
      border: 0.1rem solid transparent;
      border-radius: 999px;
      background: var(--rule-strong);
      background-clip: content-box;
    }

    .player__card::-webkit-scrollbar-thumb:hover {
      background: var(--ink-soft);
      background-clip: content-box;
    }

    .player__card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s2);
      margin-bottom: var(--s3);
    }

    .player__card-type {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.92rem;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
    }

    /* 낙관: the reader's seal, stamped in the corner of the page. */
    .player__card-position {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 2.3rem;
      height: 2.3rem;
      background: var(--accent);
      color: var(--paper);
      -webkit-mask-image: url("data:image/svg+xml,%3Csvg xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27 viewBox%3D%270 0 100 170%27 preserveAspectRatio%3D%27none%27%3E%3Cfilter id%3D%27s%27 x%3D%27-12%25%27 y%3D%27-8%25%27 width%3D%27124%25%27 height%3D%27116%25%27%3E%3CfeTurbulence type%3D%27fractalNoise%27 baseFrequency%3D%270.09%27 numOctaves%3D%273%27 seed%3D%273%27 result%3D%27t%27%2F%3E%3CfeDisplacementMap in%3D%27SourceGraphic%27 in2%3D%27t%27 scale%3D%275%27 xChannelSelector%3D%27R%27 yChannelSelector%3D%27G%27%2F%3E%3CfeGaussianBlur stdDeviation%3D%270.8%27%2F%3E%3C%2Ffilter%3E%3Cpath filter%3D%27url%28%23s%29%27 d%3D%27M6 5.5 22 3l24 1.4L70 2.6l22 2.2 3.4 20-1.2 30 1.6 34-1.1 32-2.4 22-22 2.4-26-1.6-22 1.2-16-2.6-2.6-24 1.4-32L4 62 5.2 28Z%27%2F%3E%3C%2Fsvg%3E");
      mask-image: url("data:image/svg+xml,%3Csvg xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27 viewBox%3D%270 0 100 170%27 preserveAspectRatio%3D%27none%27%3E%3Cfilter id%3D%27s%27 x%3D%27-12%25%27 y%3D%27-8%25%27 width%3D%27124%25%27 height%3D%27116%25%27%3E%3CfeTurbulence type%3D%27fractalNoise%27 baseFrequency%3D%270.09%27 numOctaves%3D%273%27 seed%3D%273%27 result%3D%27t%27%2F%3E%3CfeDisplacementMap in%3D%27SourceGraphic%27 in2%3D%27t%27 scale%3D%275%27 xChannelSelector%3D%27R%27 yChannelSelector%3D%27G%27%2F%3E%3CfeGaussianBlur stdDeviation%3D%270.8%27%2F%3E%3C%2Ffilter%3E%3Cpath filter%3D%27url%28%23s%29%27 d%3D%27M6 5.5 22 3l24 1.4L70 2.6l22 2.2 3.4 20-1.2 30 1.6 34-1.1 32-2.4 22-22 2.4-26-1.6-22 1.2-16-2.6-2.6-24 1.4-32L4 62 5.2 28Z%27%2F%3E%3C%2Fsvg%3E");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      transform: rotate(-1.5deg);
    }

    .player__card-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: flex-start;
      min-width: 0;
    }

    .player__action-rail {
      display: flex;
      width: 100%;
      flex-direction: column;
      gap: var(--s2);
      margin-top: var(--s3);
    }

    .player__support-actions {
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.35rem;
    }

    .player__support-actions .player__hint {
      margin: 0;
    }

    .player__hint-button {
      align-self: flex-start;
      margin: 0;
      padding-inline: 0;
      font-size: 0.84rem;
    }

    .player__response-actions {
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: stretch;
      gap: var(--s2);
    }

    .player__shortcut {
      margin-left: 0.35rem;
      padding: 0.05rem 0.28rem;
      border: 1px solid var(--rule);
      border-radius: 0.2rem;
      color: var(--ink-soft);
      background: var(--paper);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* Content and action rails span the card; individual controls keep their width. */
    .player__card-content > :not(button) {
      width: 100%;
      max-width: none;
    }

    .player__card-prompt {
      margin: 0;
      font-family: var(--serif);
      font-variant-numeric: oldstyle-nums;
      font-size: clamp(1.35rem, 2.6vw, 1.9rem);
      font-weight: 400;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .player__unsupported-card {
      margin: 1.25rem 0 0;
      color: var(--ink-soft);
      font-size: 0.86rem;
    }

    .player__hint {
      margin: var(--s3) 0 0;
      padding: var(--s2);
      border-left: 2px solid var(--accent);
      color: var(--ink-soft);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .mcq__options {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.35rem;
      margin: 0;
    }

    .mcq__response {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: var(--s2);
      margin: 0;
    }

    .mcq__option {
      border: 1px solid var(--rule);
      color: var(--ink);
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .mcq__option:hover:not(:disabled) {
      background: var(--rule);
    }

    .mcq__option[aria-pressed="true"] {
      background: var(--rule);
      color: var(--ink);
    }

    .mcq__option--correct {
      border-color: var(--accent);
      color: var(--accent);
    }

    .mcq__option--incorrect {
      text-decoration: line-through;
    }

    .mcq__feedback,
    .mcq__explanation {
      margin: var(--s3) 0 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .mcq__feedback--correct {
      color: var(--accent);
    }

    .mcq__feedback--incorrect {
      color: var(--ink-soft);
    }

    .mcq__explanation {
      padding-top: var(--s2);
      border-top: 1px solid var(--rule);
      font-family: var(--serif);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.5;
    }

    .mcq__check-button {
      margin: 0;
    }

    .cloze__input {
      width: auto;
      min-width: 6ch;
      max-width: 100%;
      margin-inline: 0.12em;
      padding: 0 0.2em;
      border: 0;
      border-bottom: 2px solid var(--rule-strong);
      border-radius: 0;
      color: var(--ink);
      background: transparent;
      text-align: center;
    }

    .cloze__input--correct {
      border-bottom-color: var(--accent);
      color: var(--accent);
    }

    .cloze__input--incorrect {
      border-bottom-color: var(--ink-soft);
    }

    .cloze__check-button {
      margin: 0;
    }

    .cloze__feedback {
      margin: var(--s3) 0 0;
    }

    .cloze__feedback--correct { color: var(--accent); }

    .cloze__feedback--incorrect { color: var(--ink-soft); }

    .cloze__blank-feedback {
      margin: 0.35rem 0 0;
      color: var(--ink-soft);
      font-size: 0.86rem;
    }

    .cloze__blank-feedback--correct {
      color: var(--accent);
    }

    .cloze__blank-feedback--incorrect {
      color: var(--ink-soft);
    }

    .cloze__explanation {
      margin: var(--s3) 0 0;
      padding-top: var(--s2);
      border-top: 1px solid var(--rule);
      font-family: var(--serif);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .basic__answer {
      margin: 0;
      padding-top: var(--s2);
      border-top: 1px solid var(--rule);
      font-family: var(--serif);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .basic__reveal-button {
      margin: 0;
    }

    .basic__grading-buttons {
      display: grid;
      width: min(100%, 22rem);
      align-self: flex-end;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--s2);
      margin: 0;
    }

    .basic__grading-buttons[hidden] {
      display: none;
    }

    .basic__grade-button {
      min-height: 2.75rem;
      border: 1px solid var(--rule);
      color: var(--ink);
    }

    .basic__grade-button[aria-pressed="true"] {
      color: var(--accent);
      border-color: var(--accent);
    }

    .player__footer {
      flex: none;
    }

    .player__attribution {
      position: fixed;
      right: 0;
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: 0;
      z-index: 2;
      width: min(100% - 3rem, 46rem);
      margin: 0 auto;
      color: var(--ink-soft);
      font-size: 0.72rem;
      text-align: center;
    }

    .player__attribution small {
      font-size: inherit;
    }

    .player__attribution a {
      color: inherit;
    }

    .player__attribution a:hover {
      color: var(--accent);
    }

    .player[data-state="loading"] .player__navigation {
      visibility: hidden;
    }

    .player[data-state="loading"] .player__navigation button {
      transition: none;
    }

    .player__navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      width: 100%;
      margin-top: 0;
      border-top: 1px solid var(--rule);
      padding-top: var(--s2);
    }

    .player__navigation #previous-card {
      padding-inline: 0;
    }

    .player__status {
      min-height: 1.5em;

      border-radius: 999px;

    .player__score-meter-swatch--missed { background: var(--accent); }

      gap: var(--s2);

          if (!themePreference) updateThemeToggle();
        };
        if (typeof systemTheme.addEventListener === "function") {
          systemTheme.addEventListener("change", updateForSystemTheme);
        } else if (typeof systemTheme.addListener === "function") {
          systemTheme.addListener(updateForSystemTheme);
        }
      }

      // Renderer options keep grade vocabulary, scoring, and navigation policy with the
      // card type. A renderer may omit grade validation when its values are intentionally
      // opaque; persistence then accepts non-empty strings.
      function registerCardRenderer(
        type,
        renderer,
        options = {}
      ) {
        if (typeof type !== "string" || !type.trim()) {
          throw new TypeError("A card renderer needs a non-empty type.");
        }
        if (typeof renderer !== "function") {
          throw new TypeError(`The renderer for ${type} must be a function.`);
        }
        if (!options || typeof options !== "object" || Array.isArray(options)) {
          throw new TypeError(`The options for ${type} must be an object.`);
        }
        const {
          gradeValidator = null,
          positiveGradeValidator = null,
          requiresGrade = false
        } = options;
        if (gradeValidator !== null && typeof gradeValidator !== "function") {
          throw new TypeError(`The grade validator for ${type} must be a function.`);
        }
        if (positiveGradeValidator !== null && typeof positiveGradeValidator !== "function") {
          throw new TypeError(`The positive grade validator for ${type} must be a function.`);
        }
        if (typeof requiresGrade !== "boolean") {
          throw new TypeError(`The requiresGrade option for ${type} must be a boolean.`);
        }

        const previousCardType = cardTypes[type];
        cardTypes[type] = Object.freeze({
          renderer,
          gradeValidator,
          positiveGradeValidator,
          requiresGrade
        });

        // A renderer can be loaded after a deck has already been selected. Re-run
        // validation so grades read before its validator was available cannot leak into
        // the renderer's state.
        try {
          if (state.deck) {
            state.grades = sanitizeGrades(state.deck, state.grades) || Object.create(null);
          }
        } catch (error) {
          if (previousCardType) cardTypes[type] = previousCardType;
          else delete cardTypes[type];
          throw error;
        }

        // A card type may be registered by a later, self-contained module. Repaint
        // immediately if that module is loaded after the player has started.
        if (state.deck && refs.player.dataset.state === "results") {
          renderScoreScreen();
        } else if (state.deck && state.sessionCards[state.index]?.type === type) {
          renderCurrentCard();
        }
      }

      function setDeck(deck) {
        if (!isRenderableDeck(deck)) {
          showDeckError("The page needs a deck with a title and at least one card.");
          return;
        }
        state.deck = deck;
        state.sessionCards = deck.cards.slice();
        state.scoreCards = deck.cards.slice();
        state.isRetry = false;
        state.index = 0;
        state.persistenceWarning = "";
        state.grades = progressStore.load(deck);
        state.hintsUsed = Object.create(null);
        resetDrillState();
        seedPersistedAttemptGrades();
        setViewState("ready");
        refs.title.textContent = deck.title;
        renderCurrentCard();
      }

      function resetProgress() {
        if (!state.deck) return;
        const cleared = progressStore.reset(state.deck);
        state.grades = Object.create(null);
        state.hintsUsed = Object.create(null);
        state.persistenceWarning = "";
        state.sessionCards = state.deck.cards.slice();
        state.scoreCards = state.deck.cards.slice();
        state.isRetry = false;
        state.index = 0;
        resetDrillState();
        seedPersistedAttemptGrades();
        setViewState("ready");
        renderCurrentCard();
        refs.cardFrame.focus();
        setStatus(cleared
          ? "Progress reset. Start again."
          : "Progress reset for this session, but saved progress could not be cleared.", !cleared);
      }

      function moveCard(delta) {
        if (!state.deck || !state.sessionCards.length || refs.player.dataset.state === "results") return;
        if (delta > 0) {
          processCurrentAttempt();
          if (state.index === state.sessionCards.length - 1) {
            showScoreScreen();
            return;
          }
        }
        const nextIndex = Math.max(0, Math.min(state.sessionCards.length - 1, state.index + delta));
        if (nextIndex === state.index) return;
        state.index = nextIndex;
        renderCurrentCard();
      }

      function processCurrentAttempt() {
        if (state.isRetry) return;
        const card = state.sessionCards[state.index];
        const isFreshAttempt = state.freshAttempts.has(state.index);
        // A fresh duplicate has no answer until its renderer records one. An
        // initial card with a stored grade is seeded as already processed below,
        // so persisted D1 grades do not silently start D3 drilling.
        const grade = card && (isFreshAttempt ? undefined : state.grades[card.id]);
        if (!card || !grade || state.processedAttempts.get(state.index) === grade) return;
        state.processedAttempts.set(state.index, grade);

        if (isPositiveGrade(card, grade)) {
          if (!state.cardsNeedingDrill[card.id]) return;
          const streak = (state.drillStreaks[card.id] || 0) + 1;
          state.drillStreaks[card.id] = streak;
          if (streak < REQUIRED_DRILL_STREAK) appendDrillCard(card);
          return;
        }

        state.cardsNeedingDrill[card.id] = true;
        state.drillStreaks[card.id] = 0;
        appendDrillCard(card);
      }

      function appendDrillCard(card) {
        state.sessionCards.push(card);
        state.freshAttempts.add(state.sessionCards.length - 1);
      }

      function resetDrillState() {
        state.drillStreaks = Object.create(null);
        state.cardsNeedingDrill = Object.create(null);
        state.freshAttempts = new Set();
        state.processedAttempts = new Map();
      }

      function seedPersistedAttemptGrades() {
        // Stored grades restore the existing player UI but do not count as a new
        // answer in this sitting. A learner can still re-answer the card: recordGrade
        // clears this marker for the current queue entry first.
        state.sessionCards.forEach((card, index) => {
          const grade = state.grades[card.id];
          if (grade) state.processedAttempts.set(index, grade);
        });
      }

      function renderCurrentCard() {
        if (!state.deck) return;
        state.cleanup();
        state.cleanup = () => {};
        state.persistenceWarning = "";
        const card = state.sessionCards[state.index];
        const type = typeof card.type === "string" && card.type.trim() ? card.type : "unknown";
        const cardType = cardTypes[type];
        const renderer = cardType ? cardType.renderer : renderUnsupportedCard;

        refs.cardFrame.classList.remove("player__card--empty");
        refs.cardType.textContent = type;
        refs.cardContent.replaceChildren();
        refs.cardFrame.scrollTop = 0;
        // Drops any error left by the card we navigated away from. Set before the
        // renderer runs, so a renderer that writes its own status keeps it.
        setStatus(NAVIGATION_HINT);
        try {
          const result = renderer(rendererContext(card));
          const node = result && result.node ? result.node : result;
          if (!(node instanceof Node)) {
            throw new TypeError(`The ${type} renderer did not return a DOM node.`);
          }
          refs.cardContent.replaceChildren(node);
          if (result && typeof result.onMount === "function") {
            const cleanup = result.onMount(rendererContext(card));
            if (typeof cleanup === "function") state.cleanup = cleanup;
          }
        } catch (error) {
          refs.cardContent.replaceChildren(createPromptElement("This card could not be rendered."));
          setStatus(error instanceof Error ? error.message : "The card renderer failed.", true);
        }
        updateProgress();
        announceCard();
      }

      function rendererContext(card) {
        return {
          card,
          index: state.index,
          total: state.sessionCards.length,
          createElement,
          createPromptElement,
          setStatus,
          player: rendererPlayer
        };
      }

      // This card type's own grade vocabulary — opaque to the shell (see
      // recordGrade above), meaningful only within this renderer.
      const BASIC_GRADES = Object.freeze({ KNOWN: "known", MISSED: "missed" });

      function renderBasicCard({ card, player, createElement, createPromptElement, setStatus }) {
        const fragment = document.createDocumentFragment();
        fragment.append(createPromptElement(card.prompt || "This card has no prompt."));
        const hint = createHintControls(card, player, createElement, setStatus);

        const answer = createElement("p", "basic__answer", card.answer || "This card has no answer.");
        answer.dataset.testid = "card-answer";
        answer.hidden = true;

        const reveal = createElement("button", "basic__reveal-button player__primary-action", "Show answer");
        reveal.type = "button";
        reveal.dataset.testid = "reveal-answer";
        reveal.setAttribute("aria-expanded", "false");
        reveal.setAttribute("aria-keyshortcuts", "A");
        appendShortcutLabel(reveal, "A");

        function createGradeButton(grade, label) {
          const button = createElement("button", "basic__grade-button", label);
          button.type = "button";
          button.dataset.testid = `grade-${grade}`;
          button.setAttribute("aria-pressed", "false");
          return button;
        }

        const missed = createGradeButton(BASIC_GRADES.MISSED, "Missed it");
        const known = createGradeButton(BASIC_GRADES.KNOWN, "Knew it");

        const grading = createElement("div", "basic__grading-buttons");
        grading.dataset.testid = "grading-buttons";
        grading.setAttribute("role", "group");
        grading.setAttribute("aria-label", "Grade your recall");
        grading.hidden = true;
        grading.append(missed, known);

        const actionRail = createElement("div", "player__action-rail");
        if (hint) {
          const supportActions = createActionGroup(createElement, "player__support-actions", "Optional hint");
          supportActions.append(hint);
          actionRail.append(supportActions);
        }
        const responseActions = createActionGroup(createElement, "player__response-actions", "Answer actions");
        responseActions.append(answer, reveal, grading);
        actionRail.append(responseActions);
        fragment.append(actionRail);

        function revealAnswer(shouldScroll = false) {
          answer.hidden = false;
          reveal.hidden = true;
          reveal.setAttribute("aria-expanded", "true");
          grading.hidden = false;
          if (shouldScroll) grading.scrollIntoView({ block: "nearest" });
        }

        // Pure UI update, safe to call while restoring a prior grade on mount
        // (unlike handleGradeClick, it never re-records or touches setStatus,
        // so revisiting a graded card doesn't stomp the navigation hint).
        function applyGradeUI(grade) {
          known.setAttribute("aria-pressed", String(grade === BASIC_GRADES.KNOWN));
          missed.setAttribute("aria-pressed", String(grade === BASIC_GRADES.MISSED));
        }

        function handleGradeClick(grade) {
          try {
            player.recordGrade(card.id, grade);
          } catch (error) {
            setStatus(error instanceof Error ? error.message : "The grade could not be recorded.", true);
            return;
          }
          applyGradeUI(grade);
          setStatus(grade === BASIC_GRADES.KNOWN ? "Marked as known." : "Marked as missed.");
        }

        reveal.addEventListener("click", () => revealAnswer(true));
        missed.addEventListener("click", () => handleGradeClick(BASIC_GRADES.MISSED));
        known.addEventListener("click", () => handleGradeClick(BASIC_GRADES.KNOWN));

        const existingGrade = player.getGrade(card.id);
        if (existingGrade) {
          revealAnswer();
          applyGradeUI(existingGrade);
        }

        return fragment;
      }

      const MCQ_GRADES = Object.freeze({ CORRECT: "correct", INCORRECT: "incorrect" });

      function renderMcqCard({ card, player, createElement, createPromptElement, setStatus }) {
        const fragment = document.createDocumentFragment();
        fragment.append(createPromptElement(card.prompt || "This card has no prompt."));
        const hint = createHintControls(card, player, createElement, setStatus);

        const answer = typeof card.answer === "string" && card.answer
          ? card.answer
          : "This card has no answer.";
        const choices = [answer, ...(Array.isArray(card.distractors) ? card.distractors : [])];

        // Fisher-Yates makes every option equally likely to occupy each position.
        for (let index = choices.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [choices[index], choices[swapIndex]] = [choices[swapIndex], choices[index]];
        }

        const options = createElement("div", "mcq__options");
        options.dataset.testid = "mcq-options";
        options.setAttribute("role", "group");
        options.setAttribute("aria-label", "Choose an answer");
        const optionButtons = [];

        choices.forEach((choice) => {
          const button = createElement("button", "mcq__option", choice || "This option has no text.");
          button.type = "button";
          button.dataset.testid = "mcq-option";
          button.setAttribute("aria-pressed", "false");
          optionButtons.push({ button, choice });
          options.append(button);
        });

        const checkAnswer = createElement("button", "mcq__check-button player__primary-action", "Check answer");
        checkAnswer.type = "button";
        checkAnswer.dataset.testid = "mcq-check-answer";
        checkAnswer.hidden = true;
        checkAnswer.disabled = true;

        const feedback = createElement("p", "mcq__feedback");
        feedback.dataset.testid = "mcq-feedback";
        feedback.setAttribute("role", "status");
        feedback.hidden = true;

        const explanationText = typeof card.explanation === "string" ? card.explanation : "";
        const explanation = explanationText
          ? createElement("p", "mcq__explanation")
          : null;
        if (explanation) {
          explanation.dataset.testid = "mcq-explanation";
          explanation.hidden = true;
        }

        const response = createElement("div", "mcq__response");
        response.append(options, checkAnswer);
        const actionRail = createElement("div", "player__action-rail");
        if (hint) {
          const supportActions = createActionGroup(createElement, "player__support-actions", "Optional hint");
          supportActions.append(hint);
          actionRail.append(supportActions);
        }
        response.setAttribute("role", "group");
        response.setAttribute("aria-label", "Answer actions");
        actionRail.append(response);
        fragment.append(actionRail, feedback);
        if (explanation) fragment.append(explanation);

        let selected = null;

        function applySelection(selection) {
          selected = selection;
          const hasSelection = selection !== null;
          optionButtons.forEach(({ button }) => {
            button.setAttribute("aria-pressed", String(hasSelection && button === selection.button));
          });
          checkAnswer.hidden = !hasSelection;
          checkAnswer.disabled = !hasSelection;
          if (hasSelection) checkAnswer.scrollIntoView({ block: "nearest" });
        }

        function applyAnsweredUI(grade, selectedButton = null) {
          const isCorrect = grade === MCQ_GRADES.CORRECT;
          optionButtons.forEach(({ button, choice }) => {
            button.disabled = true;
            button.setAttribute("aria-pressed", String(button === selectedButton));
            button.classList.toggle("mcq__option--correct", choice === answer);
            button.classList.toggle("mcq__option--incorrect", button === selectedButton && !isCorrect);
          });
          feedback.classList.toggle("mcq__feedback--correct", isCorrect);
          feedback.classList.toggle("mcq__feedback--incorrect", !isCorrect);
          feedback.dataset.result = grade;
          feedback.textContent = isCorrect
            ? "Correct."
            : `Incorrect. The correct answer is: ${answer}`;
          feedback.hidden = false;
          if (explanation) {
            explanation.textContent = explanationText;
            explanation.hidden = false;
          }
          checkAnswer.hidden = true;
          checkAnswer.disabled = true;
        }

        function handleOptionClick(selectedButton, selectedChoice) {
          applySelection({ button: selectedButton, choice: selectedChoice });
          setStatus("Answer selected. Check it when ready.");
        }

        function handleCheckAnswer() {
          if (!selected) return;
          const grade = selected.choice === answer ? MCQ_GRADES.CORRECT : MCQ_GRADES.INCORRECT;
          try {
            player.recordGrade(card.id, grade);
          } catch (error) {
            setStatus(error instanceof Error ? error.message : "The grade could not be recorded.", true);
            return;
          }
          applyAnsweredUI(grade, selected.button);
          setStatus(grade === MCQ_GRADES.CORRECT ? "Correct." : "Incorrect.");
        }

        optionButtons.forEach(({ button, choice }) => {
          button.addEventListener("click", () => handleOptionClick(button, choice));
        });
        checkAnswer.addEventListener("click", handleCheckAnswer);

        const existingGrade = player.getGrade(card.id);
        if (existingGrade === MCQ_GRADES.CORRECT || existingGrade === MCQ_GRADES.INCORRECT) {
          applyAnsweredUI(existingGrade);
        }

        return fragment;
      }

      const CLOZE_GRADES = Object.freeze({ CORRECT: "correct", INCORRECT: "incorrect" });

      function renderClozeCard({ card, player, createElement, createPromptElement, setStatus }) {
        const fragment = document.createDocumentFragment();
        const prompt = createPromptElement("");
        const blanks = [];
        const promptText = typeof card.prompt === "string" ? card.prompt : "";
        const blankPattern = /\{\{([^{}]*)\}\}/g;
        let cursor = 0;
        let match;

        while ((match = blankPattern.exec(promptText)) !== null) {
          prompt.append(document.createTextNode(promptText.slice(cursor, match.index)));

          const answers = match[1]
            .split("|")
            .map((answer) => answer.trim())
            .filter(Boolean);
          const input = createElement("input", "cloze__input");
          input.type = "text";
          input.dataset.testid = "cloze-input";
          input.dataset.blankIndex = String(blanks.length);
          input.setAttribute("aria-label", `Blank ${blanks.length + 1}`);
          input.autocomplete = "off";
          input.spellcheck = false;
          prompt.append(input);
          blanks.push({ answers, input });
          cursor = blankPattern.lastIndex;
        }
        prompt.append(document.createTextNode(promptText.slice(cursor)));
        fragment.append(prompt);
        const hint = createHintControls(card, player, createElement, setStatus);

        const checkAnswer = createElement("button", "cloze__check-button player__primary-action", "Check answers");
        checkAnswer.type = "button";
        checkAnswer.dataset.testid = "cloze-check-answer";

        const feedback = createElement("div", "cloze__feedback");
        feedback.dataset.testid = "cloze-feedback";
        feedback.setAttribute("role", "status");
        feedback.hidden = true;
        const feedbackSummary = createElement("p", "cloze__feedback-summary");
        feedbackSummary.dataset.testid = "cloze-feedback-summary";
        feedbackSummary.hidden = true;
        feedback.append(feedbackSummary);
        const feedbackItems = blanks.map((_, index) => {
          const item = createElement("p", "cloze__blank-feedback");
          item.dataset.testid = "cloze-blank-feedback";
          item.dataset.blankIndex = String(index);
          feedback.append(item);
          return item;
        });

        const explanationText = typeof card.explanation === "string" ? card.explanation : "";
        const explanation = explanationText
          ? createElement("p", "cloze__explanation")
          : null;
        if (explanation) {
          explanation.dataset.testid = "cloze-explanation";
          explanation.hidden = true;
        }

        const actionRail = createElement("div", "player__action-rail");
        if (hint) {
          const supportActions = createActionGroup(createElement, "player__support-actions", "Optional hint");
          supportActions.append(hint);
          actionRail.append(supportActions);
        }
        const responseActions = createActionGroup(createElement, "player__response-actions", "Answer actions");
        responseActions.append(checkAnswer);
        actionRail.append(responseActions);
        fragment.append(actionRail, feedback);
        if (explanation) fragment.append(explanation);

        function handleCheckAnswer() {
          const results = blanks.map(checkBlank);
          const grade = results.every(Boolean)
            ? CLOZE_GRADES.CORRECT
            : CLOZE_GRADES.INCORRECT;
          try {
            player.recordGrade(card.id, grade);
          } catch (error) {
            setStatus(error instanceof Error ? error.message : "The grade could not be recorded.", true);
            return;
          }
          applyAnsweredUI(grade, results);
          setStatus(grade === CLOZE_GRADES.CORRECT ? "Correct." : "Incorrect.");
        }

        function checkBlank(blank) {
          const submitted = normalizeAnswer(blank.input.value);
          return blank.answers.some((answer) => normalizeAnswer(answer) === submitted);
        }

        function normalizeAnswer(answer) {
          return answer.trim().toLowerCase();
        }

        function applyAnsweredUI(grade, results = null) {
          const isCorrect = grade === CLOZE_GRADES.CORRECT;
          feedback.classList.toggle("cloze__feedback--correct", isCorrect);
          feedback.classList.toggle("cloze__feedback--incorrect", !isCorrect);
          feedback.dataset.result = grade;
          if (results) {
            feedbackSummary.hidden = true;
            blanks.forEach((blank, index) => {
              const blankCorrect = results[index];
              blank.input.disabled = true;
              blank.input.classList.toggle("cloze__input--correct", blankCorrect);
              blank.input.classList.toggle("cloze__input--incorrect", !blankCorrect);
              blank.input.dataset.result = blankCorrect
                ? CLOZE_GRADES.CORRECT
                : CLOZE_GRADES.INCORRECT;
              blank.input.setAttribute("aria-invalid", String(!blankCorrect));
              feedbackItems[index].hidden = false;
              feedbackItems[index].classList.toggle("cloze__blank-feedback--correct", blankCorrect);
              feedbackItems[index].classList.toggle("cloze__blank-feedback--incorrect", !blankCorrect);
              feedbackItems[index].dataset.result = blankCorrect
                ? CLOZE_GRADES.CORRECT
                : CLOZE_GRADES.INCORRECT;
              feedbackItems[index].textContent = blankCorrect
                ? `Blank ${index + 1}: Correct.`
                : `Blank ${index + 1}: Incorrect. Correct answer: ${blank.answers.join(" / ")}`;
            });
          } else {
            feedbackSummary.hidden = false;
            feedbackSummary.textContent = isCorrect
              ? "Correct."
              : "This card was previously marked incorrect.";
            blanks.forEach((blank, index) => {
              blank.input.disabled = true;
              blank.input.classList.remove("cloze__input--correct", "cloze__input--incorrect");
              blank.input.removeAttribute("data-result");
              blank.input.removeAttribute("aria-invalid");
              feedbackItems[index].hidden = true;
              feedbackItems[index].classList.remove(
                "cloze__blank-feedback--correct",
                "cloze__blank-feedback--incorrect"
              );
              feedbackItems[index].removeAttribute("data-result");
              feedbackItems[index].textContent = "";
            });
          }
          feedback.hidden = false;
          checkAnswer.hidden = true;
          checkAnswer.disabled = true;
          if (explanation) {
            explanation.textContent = explanationText;
            explanation.hidden = false;
          }
        }

        checkAnswer.addEventListener("click", handleCheckAnswer);

        const existingGrade = player.getGrade(card.id);
        if (existingGrade === CLOZE_GRADES.CORRECT || existingGrade === CLOZE_GRADES.INCORRECT) {
          applyAnsweredUI(existingGrade);
        }

        return fragment;
      }

      function createHintControls(card, player, createElement, setStatus) {
        const hintText = typeof card.hint === "string" && card.hint.trim()
          ? card.hint
          : "";
        if (!hintText) return null;

        const fragment = document.createDocumentFragment();
        const hint = createElement("p", "player__hint", hintText);
        hint.dataset.testid = "card-hint";
        hint.hidden = true;

        const reveal = createElement("button", "player__hint-button", "Show hint");
        reveal.type = "button";
        reveal.dataset.testid = "show-hint";
        reveal.setAttribute("aria-expanded", "false");
        reveal.setAttribute("aria-keyshortcuts", "H");
        appendShortcutLabel(reveal, "H");

        function applyHintUI() {
          hint.hidden = false;
          reveal.hidden = true;
          reveal.setAttribute("aria-expanded", "true");
        }

        function handleHintClick() {
          try {
            player.recordHintUsed(card.id);
          } catch (error) {
            setStatus(error instanceof Error ? error.message : "The hint could not be recorded.", true);
            return;
          }
          applyHintUI();
        }

        reveal.addEventListener("click", handleHintClick);
        if (player.getHintUsed(card.id)) applyHintUI();
        fragment.append(hint, reveal);
        return fragment;
      }

      function appendShortcutLabel(button, shortcut) {
        const label = createElement("kbd", "player__shortcut", shortcut);
        label.setAttribute("aria-hidden", "true");
        button.append(label);
      }

      function createActionGroup(createElement, className, label) {
        const group = createElement("div", className);
        group.setAttribute("role", "group");
        group.setAttribute("aria-label", label);
        return group;
      }

      function renderPromptCard({ card }) {
        const fragment = document.createDocumentFragment();
        fragment.append(createPromptElement(card.prompt || "This card has no prompt."));
        return fragment;
      }

      function renderUnsupportedCard({ card }) {
        const fragment = document.createDocumentFragment();
        fragment.append(createPromptElement(card.prompt || "This card has no prompt."));
        fragment.append(createElement(
          "p",
          "player__unsupported-card",
          `The “${card.type || "unknown"}” card renderer is not installed yet.`
        ));
        return fragment;
      }

      // Grades are keyed by card id rather than index, so they survive deck
      // navigation and stay meaningful to a later score screen (B3) even if
      // cards are ever reordered. Each renderer defines and interprets its own grade
      // vocabulary; persistence restores only grades that belong to the current deck
      // and pass the registered renderer validator.
      function recordGrade(cardId, grade) {
        if (typeof cardId !== "string" || !cardId) {
          throw new TypeError("A grade needs a card id.");
        }
        if (typeof grade !== "string" || !grade) {
          throw new TypeError("A grade needs a non-empty value.");
        }
        if (state.deck) {
          const card = state.deck.cards.find((candidate) => candidate && candidate.id === cardId);
          if (!card) throw new Error("That card is not in the current deck.");
          if (!isValidStoredGrade(card, grade)) {
            throw new Error(`The grade is not valid for the ${card.type || "unknown"} card.`);
          }
        }
        state.grades[cardId] = grade;
        const currentCard = state.sessionCards[state.index];
        if (currentCard && currentCard.id === cardId) {
          state.freshAttempts.delete(state.index);
          // A repeat click is an explicit answer for this sitting, even when it
          // matches a grade restored from storage or a prior attempt.
          state.processedAttempts.delete(state.index);
        }
        if (state.deck) {
          const persisted = progressStore.saveGrade(state.deck, { [cardId]: grade });
          if (persisted) {
            state.persistenceWarning = "";
          } else {
            state.persistenceWarning = "Progress could not be saved. Try again.";
            setStatus(state.persistenceWarning, true);
          }
          updateProgress();
          return persisted;
        }
        return true;
      }

      function getGrade(cardId) {
        return state.grades[cardId];
      }

      function recordHintUsed(cardId) {
        if (typeof cardId !== "string" || !cardId) {
          throw new TypeError("A hint needs a card id.");
        }
        if (state.deck) {
          const card = state.deck.cards.find((candidate) => candidate && candidate.id === cardId);
          if (!card) throw new Error("That card is not in the current deck.");
          if (typeof card.hint !== "string" || !card.hint.trim()) {
            throw new Error("That card does not have a hint.");
          }
        }
        state.hintsUsed[cardId] = true;
        return true;
      }

      function getHintUsed(cardId) {
        return Boolean(state.hintsUsed[cardId]);
      }

      // Renderers see fresh controls for adaptive duplicates and D2 retry cards,
      // while the public grade API and score calculations retain the persisted value.
      function getRendererGrade(cardId) {
        const grade = getGrade(cardId);
        const card = state.sessionCards[state.index];
        if (!card || card.id !== cardId) return grade;
        if (state.freshAttempts.has(state.index)) return undefined;
        if (!state.isRetry) return grade;
        return isPositiveGrade(card, grade) ? grade : undefined;
      }

      // Renderers can grade their own card, track hint use, and restore those values,
      // but they cannot replace the active deck, mutate the registry, or inspect shell
      // state.
      const rendererPlayer = Object.freeze({
        recordGrade,
        getGrade: getRendererGrade,
        recordHintUsed,
        getHintUsed
      });

      function showDeckError(message) {
        state.cleanup();
        state.cleanup = () => {};
        state.deck = null;
        state.sessionCards = [];
        state.scoreCards = [];
        state.isRetry = false;
        resetDrillState();
        setViewState("error");
        state.hintsUsed = Object.create(null);
        refs.title.textContent = "Unable to load deck";
        refs.progress.max = 1;
        refs.progress.value = 0;
        refs.progress.setAttribute("aria-label", "No cards loaded");
        refs.progressLabel.textContent = "No cards loaded";
        refs.progressPercent.textContent = "0%";
        refs.cardType.textContent = "Deck error";
        refs.cardPosition.textContent = "—";
        refs.cardContent.replaceChildren(createPromptElement(message));
        refs.cardFrame.classList.add("player__card--empty");
        const focused = document.activeElement;
        refs.previous.disabled = true;
        refs.next.disabled = true;
        refs.next.classList.remove("player__next-button--skip");
        refs.next.textContent = "Next →";
        refs.next.setAttribute("aria-label", "Next card");
        restoreNavigationFocus(focused);
        setStatus(message, true);
      }

      function setStatus(message, isError = false) {
        let text = message || "";
        if (state.persistenceWarning && !isError) {
          text = state.persistenceWarning;
          isError = true;
        }
        // Rewriting a live region re-announces it, so an unchanged hint stays untouched
        // rather than repeating itself on every card change.
        if (refs.status.textContent !== text) refs.status.textContent = text;
        refs.status.classList.toggle("player__status--navigation-hint", text === NAVIGATION_HINT);
        refs.status.classList.toggle("player__status--error", Boolean(isError));
      }

      function updateProgress() {
        const total = state.sessionCards.length;
        const position = state.index + 1;
        const percent = Math.round((position / total) * 100);
        refs.progress.max = total;
        refs.progress.value = position;
        refs.progress.setAttribute("aria-label", `Card ${position} of ${total}`);
        refs.progressLabel.textContent = `Card ${position} of ${total}`;
        refs.progressPercent.textContent = `${percent}%`;
        const width = String(total).length;
        refs.cardPosition.textContent =
          `${String(position).padStart(width, "0")}/${total}`;
        const focused = document.activeElement;
        refs.previous.disabled = state.index === 0;
        const card = state.sessionCards[state.index];
        const atLastCard = state.index === total - 1;
        const currentGrade = state.freshAttempts.has(state.index) ? undefined : state.grades[card.id];
        const isSkip = !atLastCard && isAnswerRequiredCard(card) && !currentGrade;
        refs.next.disabled = false;
        refs.next.classList.toggle("player__next-button--skip", isSkip);
        refs.next.textContent = atLastCard ? "See results →" : (isSkip ? "Skip →" : "Next →");
        refs.next.setAttribute(
          "aria-label",
          atLastCard ? "See results" : (isSkip ? "Skip to next card" : "Next card")
        );
        restoreNavigationFocus(focused);
      }

      function isAnswerRequiredCard(card) {
        const cardType = cardTypes[card.type];
        return Boolean(cardType && cardType.requiresGrade);
      }

      function showScoreScreen() {
        state.cleanup();
        state.cleanup = () => {};
        const result = renderScoreScreen();
        setViewState("results");
        setStatus(`Session complete. Score ${result.score}/${result.total}.`);
        refs.scoreTitle.focus();
      }

      function renderScoreScreen() {
        const { grades, scoreCards } = state;
        const total = scoreCards.length;
        const score = scoreCards.filter((card) => isPositiveGrade(card, grades[card.id])).length;
        const missedCards = getMissedCards(scoreCards, grades);

        refs.scoreValue.textContent = `${score}/${total}`;
        const missedCount = missedCards.length;
        refs.scoreSummary.textContent = missedCount
          ? `${score} correct · ${missedCount} to review`
          : `All ${total} correct · Nothing to review`;
        const correctShare = total ? (score / total) * 100 : 0;
        const missedShare = total ? (missedCount / total) * 100 : 0;
        refs.scoreCorrectSegment.style.flexBasis = `${correctShare}%`;
        refs.scoreMissedSegment.style.flexBasis = `${missedShare}%`;
        refs.scoreCorrectLabel.textContent = `${score} correct`;
        refs.scoreMissedLabel.textContent = missedCount
          ? `${missedCount} to review`
          : "Nothing to review";
        refs.retryMissed.disabled = missedCount === 0;
        refs.retryMissed.hidden = missedCount === 0;
        refs.retryMissed.textContent = missedCount
          ? `Retry ${missedCount} missed card${missedCount === 1 ? "" : "s"}`
          : "Retry missed cards";
        refs.missedCards.replaceChildren(...missedCards.map(createMissedCard));
        refs.missedCards.hidden = missedCards.length === 0;
        refs.noMissedCards.hidden = missedCards.length !== 0;
        refs.progress.max = total;
        refs.progress.value = total;
        refs.progress.setAttribute("aria-label", `Session complete: score ${score} of ${total}`);
        refs.progressLabel.textContent = `Session complete: ${score} of ${total}`;
        refs.progressPercent.textContent = "100%";
        refs.announcer.textContent = `Session complete. Score ${score}/${total}.`;
        updateReviewScrollCue();

        return { score, total };
      }

      function retryMissedCards() {
        if (!state.deck || refs.player.dataset.state !== "results") return;
        const missedCards = getMissedCards(state.scoreCards, state.grades);
        if (!missedCards.length) {
          refs.retryMissed.disabled = true;
          setStatus("Nothing to retry.");
          return;
        }

        state.sessionCards = missedCards.slice();
        state.scoreCards = missedCards.slice();
        state.isRetry = true;
        state.index = 0;
        resetDrillState();
        setViewState("ready");
        renderCurrentCard();
        refs.cardFrame.focus();
        setStatus(`Retrying ${missedCards.length} missed card${missedCards.length === 1 ? "" : "s"}.`);
      }

      function getMissedCards(cards, grades) {
        return cards.filter((card) => !isPositiveGrade(card, grades[card.id]));
      }

      function isPositiveGrade(card, grade) {
        const cardType = cardTypes[card.type];
        if (!cardType || typeof cardType.positiveGradeValidator !== "function") return false;
        try {
          return Boolean(cardType.positiveGradeValidator(grade, card));
        } catch {
          return false;
        }
      }

      function createMissedCard(card) {
        const item = createElement("li", "player__missed-card");
        item.dataset.testid = "missed-card";
        const prompt = createElement(
          "p",
          "player__missed-prompt",
          card.prompt || "This card has no prompt."
        );
        prompt.dataset.testid = "missed-prompt";
        item.append(prompt);
        if (card.answer) item.append(createReviewField("Answer", card.answer));
        if (card.explanation) item.append(createReviewField("Explanation", card.explanation));
        if (getHintUsed(card.id)) item.append(createReviewField("Hint", "Needed a hint"));
        return item;
      }

      function createReviewField(label, value) {
        const field = createElement("p", "player__review-field");
        field.dataset.testid = `missed-${label.toLowerCase()}`;
        field.append(
          createElement("strong", "player__review-label", `${label}:`),
          document.createTextNode(` ${String(value)}`)
        );
        return field;
      }

      function setViewState(view) {
        const showingResults = view === "results";
        refs.player.dataset.state = view;
        refs.cardFrame.hidden = showingResults;
        refs.navigation.hidden = showingResults;
        refs.scoreScreen.hidden = !showingResults;
        if (showingResults) {
          refs.scoreScreen.scrollTop = 0;
          updateReviewScrollCue();
        } else {
          refs.reviewScrollOverlay.hidden = true;
        }
      }

      function updateReviewScrollCue() {
        const panel = refs.scoreScreen;
        const maxScrollTop = Math.max(0, panel.scrollHeight - panel.clientHeight);
        const hasReviewCards = refs.missedCards.children.length > 0;
        const hasMore = hasReviewCards && maxScrollTop > 1 && panel.scrollTop < maxScrollTop - 1;
        refs.reviewScrollOverlay.hidden = !hasMore;
      }

      function scrollReview() {
        if (refs.scoreScreen.hidden) return;
        refs.scoreScreen.focus({ preventScroll: true });
        const maxScrollTop = Math.max(0, refs.scoreScreen.scrollHeight - refs.scoreScreen.clientHeight);
        const targetTop = Math.min(
          maxScrollTop,
          refs.scoreScreen.scrollTop + refs.scoreScreen.clientHeight * 0.85
        );
        refs.scoreScreen.scrollTo({
          top: targetTop,
          behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"
        });
      }

      // Reaching the first or last card disables the button that got you there, which
      // would otherwise drop focus to the body and lose a keyboard user's place. The
      // caller has to capture the focused element first: disabling it blurs it at once.
      function restoreNavigationFocus(focused) {
        if (focused !== refs.previous && focused !== refs.next) return;
        if (!focused.disabled) return;
        const sibling = focused === refs.next ? refs.previous : refs.next;
        (sibling.disabled ? refs.cardFrame : sibling).focus();
      }

      function announceCard() {
        const position = state.index + 1;
        const total = state.sessionCards.length;
        refs.announcer.textContent = `Card ${position} of ${total}. ${refs.cardContent.textContent}`;
      }

      // Deliberately lenient: the deck validator owns the strict contract, and the shell
      // only needs enough structure to paint something rather than throw.
      function isRenderableDeck(candidate) {
        if (!candidate || typeof candidate !== "object") return false;
        if (typeof candidate.title !== "string" || !candidate.title.trim()) return false;
        if (!Array.isArray(candidate.cards) || candidate.cards.length === 0) return false;
        return candidate.cards.every((card) => card && typeof card === "object");
      }

      function sanitizeGrades(deck, grades) {
        if (!grades || typeof grades !== "object" || Array.isArray(grades)) return null;
        const cardsById = getCardsById(deck);
        const sanitized = Object.create(null);
        for (const [cardId, grade] of Object.entries(grades)) {
          const card = cardsById[cardId];
          if (!card) continue;
          if (!isValidStoredGrade(card, grade)) return null;
          sanitized[cardId] = grade;
        }
        return sanitized;
      }

      function getCardsById(deck) {
        const cached = deckCardMaps.get(deck);
        if (cached && cached.cards === deck.cards) return cached.byId;
        const byId = Object.create(null);
        deck.cards.forEach((card) => {
          if (card && typeof card.id === "string" && card.id) byId[card.id] = card;
        });
        deckCardMaps.set(deck, { cards: deck.cards, byId });
        return byId;
      }

      function isValidStoredGrade(card, grade) {
        const cardType = cardTypes[card.type];
        const gradeValidator = cardType && cardType.gradeValidator;
        if (typeof gradeValidator !== "function") {
          return typeof grade === "string" && Boolean(grade);
        }
        return Boolean(gradeValidator(grade, card));
      }

      // This boundary owns localStorage keys, validation, conflict retries, and the
      // recovery path after a failed reset. The player only sees load/save/reset/sync.
      function createProgressStore() {
        const pendingWrites = new WeakMap();

        return Object.freeze({ load, saveGrade, reset, sync });

        function load(deck) {
          const key = getProgressKey(deck);
          if (!key) return Object.create(null);
          try {
            const stored = window.localStorage.getItem(key);
            if (stored === null) return Object.create(null);
            const parsed = JSON.parse(stored);
            if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
              return Object.create(null);
            }
            return sanitizeGrades(deck, parsed) || Object.create(null);
          } catch {
            return Object.create(null);
          }
        }

        function saveGrade(deck, gradePatch) {
          if (!getProgressKey(deck)) return false;
          const currentGrades = sanitizeGrades(deck, gradePatch);
          if (!currentGrades) return false;
          const pending = pendingWrites.get(deck);
          const queued = pending
            ? Object.assign(pending.grades, currentGrades)
            : currentGrades;
          const replaceStored = Boolean(pending && pending.replaceStored);
          const persisted = writeMerged(deck, queued, replaceStored);
          if (persisted) pendingWrites.delete(deck);
          else pendingWrites.set(deck, { grades: queued, replaceStored });
          return persisted;
        }

        function reset(deck) {
          const key = getProgressKey(deck);
          if (!key) return false;
          const cleared = clear(key);
          if (cleared) pendingWrites.delete(deck);
          else pendingWrites.set(deck, { grades: Object.create(null), replaceStored: true });
          return cleared;
        }

        function sync(deck, localGrades, event) {
          const key = getProgressKey(deck);
          if (!key || (event.key !== null && event.key !== key)) return null;

          const storageWasCleared = event.key === null || event.newValue === null;
          const loadedGrades = load(deck);
          if (storageWasCleared) {
            pendingWrites.delete(deck);
            return loadedGrades;
          }

          const pending = pendingWrites.get(deck);
          if (pending) {
            const authoritativeGrades = sanitizeGrades(
              deck,
              Object.assign(Object.create(null), localGrades, pending.grades)
            ) || Object.create(null);
            const persisted = writeMerged(deck, authoritativeGrades, pending.replaceStored);
            if (persisted) pendingWrites.delete(deck);
            else pendingWrites.set(deck, { grades: authoritativeGrades, replaceStored: pending.replaceStored });
            return authoritativeGrades;
          }

          const mergedGrades = Object.assign(Object.create(null), localGrades, loadedGrades);
          const missingGrades = Object.create(null);
          for (const [cardId, grade] of Object.entries(mergedGrades)) {
            if (!(cardId in loadedGrades)) missingGrades[cardId] = grade;
          }
          if (Object.keys(missingGrades).length) {
            const persisted = writeMerged(deck, missingGrades, false);
            if (!persisted) pendingWrites.set(deck, { grades: missingGrades, replaceStored: false });
          }
          return mergedGrades;
        }

        function writeMerged(deck, gradePatch, replaceStored) {
          const key = getProgressKey(deck);
          if (!key) return false;
          try {
            const currentGrades = sanitizeGrades(deck, gradePatch);
            if (!currentGrades) return false;
            for (let attempt = 0; attempt < 3; attempt += 1) {
              const persistedGrades = replaceStored ? Object.create(null) : load(deck);
              const serialized = JSON.stringify(
                Object.assign(Object.create(null), persistedGrades, currentGrades)
              );
              window.localStorage.setItem(key, serialized);
              if (window.localStorage.getItem(key) === serialized) return true;
            }
            return false;
          } catch {
            return false;
          }
        }

        function clear(key) {
          try {
            window.localStorage.removeItem(key);
            return true;
          } catch {
            return false;
          }
        }

        function getProgressKey(deck) {
          if (!deck || typeof deck.id !== "string" || !deck.id.trim()) return null;
          return `fc:${deck.id}:v1`;
        }
      }

      const progressStore = createProgressStore();

      // Every renderer should build its prompt with this: the card frame is labelled by
      // the element's id, so a renderer that rolls its own leaves the card unnamed.
      function createPromptElement(text) {
        const prompt = createElement("p", "player__card-prompt", text);
        prompt.id = PROMPT_ID;
        prompt.dataset.testid = PROMPT_ID;
        return prompt;
      }

      function createElement(tagName, className, text) {
        const element = document.createElement(tagName);
        if (className) element.className = className;
        if (text !== undefined && text !== null) element.textContent = String(text);
        return element;
      }

      const api = {
        registerCardRenderer,
        setDeck,
        recordGrade,
        getGrade,
        recordHintUsed,
        getHintUsed,
        getState: () => ({
          deck: state.deck,
          index: state.index,
          total: state.sessionCards.length,
          grades: { ...state.grades },
          hintsUsed: { ...state.hintsUsed }
        })
      };

      // The shell owns this registry and navigation. Each card-type issue can add
      // or replace exactly one renderer without changing the shell or other types.
      registerCardRenderer(
        "basic",
        renderBasicCard,
        {
          gradeValidator: (grade) => grade === BASIC_GRADES.KNOWN || grade === BASIC_GRADES.MISSED,
          positiveGradeValidator: (grade) => grade === BASIC_GRADES.KNOWN,
          requiresGrade: true
        }
      );
      registerCardRenderer(
        "mcq",
        renderMcqCard,
        {
          gradeValidator: (grade) => grade === MCQ_GRADES.CORRECT || grade === MCQ_GRADES.INCORRECT,
          positiveGradeValidator: (grade) => grade === MCQ_GRADES.CORRECT,
          requiresGrade: true
        }
      );
      registerCardRenderer(
        "cloze",
        renderClozeCard,
        {
          gradeValidator: (grade) => grade === CLOZE_GRADES.CORRECT || grade === CLOZE_GRADES.INCORRECT,
          positiveGradeValidator: (grade) => grade === CLOZE_GRADES.CORRECT,
          requiresGrade: true
        }
      );
      window.CRAM_PLAYER = api;

      refs.player.addEventListener("click", (event) => {
        const button = event.target instanceof Element
          ? event.target.closest("button[data-action]")
          : null;
        if (!button) return;
        if (button.dataset.action === "previous") moveCard(-1);
        if (button.dataset.action === "next") moveCard(1);
        if (button.dataset.action === "retry-missed") retryMissedCards();
        if (button.dataset.action === "reset-progress") resetProgress();
        if (button.dataset.action === "scroll-review") scrollReview();
        if (button.dataset.action === "toggle-theme") toggleTheme();
      });

      refs.scoreScreen.addEventListener("scroll", updateReviewScrollCue, { passive: true });
      window.addEventListener("resize", updateReviewScrollCue);

      window.addEventListener("storage", (event) => {
        if (!state.deck) return;
        const currentCard = state.sessionCards[state.index];
        const previousGrade = currentCard && state.grades[currentCard.id];
        const grades = progressStore.sync(state.deck, state.grades, event);
        if (!grades) return;
        state.grades = grades;
        if (refs.player.dataset.state === "results") {
          renderScoreScreen();
        } else if (currentCard && previousGrade !== state.grades[currentCard.id]) {
          renderCurrentCard();
        }
      });

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target.isContentEditable) {
          return;
        }
        if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) {
          return;
        }

        const key = event.key.toLowerCase();
        if (key === "h" && triggerCardShortcut("H")) {
          event.preventDefault();
        } else if (key === "a" && triggerCardShortcut("A")) {
          event.preventDefault();
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          moveCard(-1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          moveCard(1);
        }
      });

      // Renderers declare keyboard actions through the standard aria-keyshortcuts
      // attribute, so the shell never needs to know their private test ids or markup.
      function triggerCardShortcut(shortcut) {
        const expected = shortcut.toLowerCase();
        const button = [...refs.cardContent.querySelectorAll("button[aria-keyshortcuts]")]
          .find((candidate) => {
            const shortcuts = candidate.getAttribute("aria-keyshortcuts")
              .toLowerCase()
              .split(/\s+/);
            return shortcuts.includes(expected) && !candidate.hidden && !candidate.disabled;
          });
        if (!button) return false;
        button.click();
        return true;
      }

      initializeTheme();

      const injectedDeck = window.__DECK__;
      setDeck(injectedDeck === null || injectedDeck === undefined ? previewDeck : injectedDeck);
    })();
  </script>
</body>
</html>
